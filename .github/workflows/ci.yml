name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build CampusSafetyHub.sln --configuration Release
      - run: dotnet run --project tests/CampusSafetyHub.Tests --configuration Release --no-build
      - run: dotnet run --project src/CampusSafetyHub --configuration Release --no-build
